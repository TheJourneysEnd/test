services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "7676:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy-network

  backend:
    build: ./backend
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
    container_name: flask-backend
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge
